<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login Admin - Funebrero</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { background-color: #020617; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Poppins', sans-serif; }
    .login-container { background: rgba(15, 23, 42, 0.9); padding: 40px; border-radius: 12px; border: 1px solid rgba(255,140,0,0.3); text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 350px; width: 100%; }
    .password-container { position: relative; width: 100%; margin-bottom: 25px; }
    .password-container input { width: 100%; box-sizing: border-box; padding: 12px; padding-right: 40px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-family: inherit; }
    .password-container input:focus { border-color: #ff8c00; }
    .toggle-password { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem; padding: 0; outline: none; }
    .toggle-password:hover { color: #ff8c00; }
  </style>
</head>
<body>

  <form id="loginForm" class="login-container" autocomplete="off">
    <h2 style="color: #ff8c00; margin-bottom: 25px; font-weight: 600;">🛡️ Acceso Admin</h2>
    <input type="email" id="email" placeholder="Email Autorizado" required autocomplete="username" style="width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-family: inherit;" />
    
    <div class="password-container">
      <input type="password" id="password" placeholder="Contraseña" required autocomplete="current-password" />
      <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Mostrar contraseña">👁️</button>
    </div>

    <button type="submit" id="loginBtn" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #ff6b00, #ff8c00); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; font-family: inherit;">Ingresar al Panel</button>
    <p id="errorMsg" style="color: #ef4444; display: none; margin-top: 15px; font-size: 0.85rem; font-weight: bold;">Credenciales inválidas o acceso no autorizado.</p>
    <a href="/index.html" style="display:inline-block; margin-top:18px; color:#94a3b8; font-size:0.8rem; text-decoration:none;">← Volver al sitio</a>
  </form>

  <script type="module">
    import { auth } from "./js/services/firebase.config.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const toggleBtn = document.getElementById("togglePasswordBtn");
    const passwordInput = document.getElementById("password");
    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const btn = document.getElementById("loginBtn");

    let failedAttempts = 0;

    toggleBtn.addEventListener("click", function () {
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
      this.textContent = type === "password" ? "👁️" : "🙈";
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (failedAttempts >= 5) {
        errorMsg.textContent = "Demasiados intentos fallidos. Esperá unos minutos.";
        errorMsg.style.display = "block";
        return;
      }

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = passwordInput.value;

      try {
        btn.disabled = true;
        btn.textContent = "Verificando...";
        errorMsg.style.display = "none";
        await signInWithEmailAndPassword(auth, email, password);
        window.location.replace("/admin.html");
      } catch (err) {
        failedAttempts++;
        errorMsg.textContent = "Credenciales inválidas o acceso no autorizado.";
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Ingresar al Panel";
      }
    });
  </script>
</body>
</html>

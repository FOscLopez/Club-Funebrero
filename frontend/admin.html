<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Club Funebrero</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrapper { max-width: 1000px; margin: 40px auto; padding: 20px; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dc2626; padding-bottom: 15px; margin-bottom: 30px; }
    .admin-card { background: rgba(15, 15, 15, 0.8); border: 1px solid rgba(220, 38, 38, 0.3); border-radius: 12px; padding: 25px; margin-bottom: 30px; backdrop-filter: blur(10px); }
    .form-group { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .form-input, .form-select { flex: 1; min-width: 200px; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #050505; color: #fff; font-family: 'Poppins', sans-serif; outline: none; }
    .form-input:focus, .form-select:focus { border-color: #dc2626; }
    .action-btn { background: #dc2626; color: #fff; border: none; border-radius: 6px; padding: 12px 25px; font-family: 'Bebas Neue', cursive; font-size: 1.2rem; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
    .action-btn:hover { background: #ff3b3b; transform: translateY(-2px); }
    .logout-btn { background: transparent; border: 1px solid #a3a3a3; color: #a3a3a3; border-radius: 6px; padding: 8px 15px; cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif; }
    .logout-btn:hover { border-color: #fff; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95rem; }
    th, td { padding: 15px 10px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #dc2626; font-weight: 600; text-transform: uppercase; font-family: 'Bebas Neue', cursive; font-size: 1.2rem; letter-spacing: 1px; }
    .delete-btn { background: transparent; border: 1px solid #7f1d1d; color: #ff3b3b; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.3s; }
    .delete-btn:hover { background: #7f1d1d; color: #fff; }
  </style>
</head>
<body style="background: #050505; color: #fff;">
  
  <div class="admin-wrapper">
    <div class="admin-header">
      <div style="display: flex; align-items: center; gap: 15px;">
        <img src="logo-funebrero_2.png" alt="Logo" style="height: 50px;">
        <h2 style="font-family: 'Bebas Neue', cursive; font-size: 2.5rem; margin: 0;">Panel de <span style="color: #dc2626;">Control</span></h2>
      </div>
      <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
    </div>

    <!-- Módulo de Carga -->
    <div class="admin-card">
      <h3 style="font-family: 'Bebas Neue', cursive; font-size: 1.8rem; margin-bottom: 20px; color: #dc2626; letter-spacing: 1px;">Programar Nuevo Partido</h3>
      <form id="fixtureForm">
        <div class="form-group">
          <select id="categoria" class="form-select" required>
            <option value="">Seleccionar Categoría</option>
            <option value="Mosquito">Mosquito</option>
            <option value="Mini">Mini</option>
            <option value="Pre Mini">Pre Mini</option>
            <option value="U11">U11</option>
            <option value="U13">U13</option>
            <option value="U15">U15</option>
            <option value="U17">U17</option>
            <option value="U21">U21</option>
            <option value="Primera">Primera</option>
            <option value="Maxi 35">Maxi 35</option>
            <option value="Maxi 42">Maxi 42</option>
          </select>
          <select id="condicion" class="form-select" required>
            <option value="">Localía del Funebrero</option>
            <option value="local">Jugamos de Local</option>
            <option value="visita">Jugamos de Visitante</option>
          </select>
        </div>
        <div class="form-group">
          <input type="text" id="rival" class="form-input" placeholder="Nombre del Equipo Rival" required>
          <input type="date" id="fecha" class="form-input" required>
          <input type="time" id="hora" class="form-input">
        </div>
        <button type="submit" class="action-btn" id="saveBtn">Guardar Partido en Fixture</button>
      </form>
    </div>

    <!-- Módulo de Listado -->
    <div class="admin-card" style="overflow-x: auto;">
      <h3 style="font-family: 'Bebas Neue', cursive; font-size: 1.8rem; margin-bottom: 10px; color: #dc2626; letter-spacing: 1px;">Partidos Activos</h3>
      <table>
        <thead>
          <tr>
            <th>Categoría</th>
            <th>Día y Hora</th>
            <th>Local</th>
            <th>Visitante</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="fixturesList">
          <tr><td colspan="5" style="text-align:center;">Cargando base de datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
